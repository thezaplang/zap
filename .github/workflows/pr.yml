name: Build and test

on:
  pull_request:
    types: [ opened, synchronize, labeled ]

jobs:
  build-and-test:
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build build-essential python3

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh 
          sudo ./llvm.sh 21 all

      - name: Build project
        run: |
          chmod +x ./build.sh
          export PATH="/usr/lib/llvm-21/bin:$PATH"
          export CC=clang-21
          export CXX=clang++-21
          export LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ./build.sh

      - name: Run test script
        run: |
          chmod +x ./run_tests.sh
          export PATH="/usr/lib/llvm-21/bin:$PATH"
          export CC=clang-21
          export CXX=clang++-21
          export LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ./run_tests.sh

  sanitizers:
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build build-essential clang python3

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all

      - name: Run sanitizer suite
        run: |
          chmod +x ./scripts/run_sanitizers.sh
          export PATH="/usr/lib/llvm-21/bin:$PATH"
          export CC=clang-21
          export CXX=clang++-21
          export LLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ./scripts/run_sanitizers.sh

  frontend:
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install frontend build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build build-essential python3

      - name: Configure without compiler dependencies
        run: meson setup build-frontend -Dbuild_compiler=false

      - name: Verify compiler dependencies and targets are absent
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          info = Path("build-frontend/meson-info")
          dependencies = json.loads((info / "intro-dependencies.json").read_text())
          targets = json.loads((info / "intro-targets.json").read_text())
          assert not {"llvm", "openssl"} & {dep["name"].lower() for dep in dependencies}
          assert not {"zapc", "zap_runtime", "zap_zir_verifier"} & {target["name"] for target in targets}
          PYTHON

      - name: Build frontend
        run: meson compile -C build-frontend

      - name: Run frontend tests
        run: meson test -C build-frontend --print-errorlogs
